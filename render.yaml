services:
  - type: web
    name: shadowban-server
    runtime: node
    plan: free
    buildCommand: cd apps/server && npm install && npm run build
    startCommand: cd apps/server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: shadowban-db
          property: connectionString
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: shadowban-client
          property: hostport

  - type: web
    name: shadowban-client
    runtime: static
    buildCommand: cd apps/client && npm install && npm run build
    staticPublishPath: apps/client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: shadowban-server
          property: hostport

databases:
  - name: shadowban-db
    databaseName: shadowban
    user: shadowban
    plan: free
